name: 🔍 Check Changeset

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

jobs:
  check:
    name: Require changeset or 'no-changeset' label
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check for changeset or label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q "no-changeset"; then
            echo "✅ 'no-changeset' label found. Skipping changeset check."
            exit 0
          fi

          CHANGED=$(git diff --name-only origin/main...HEAD -- '.changeset/*.md' | grep -v 'README.md' || true)

          if [ -z "$CHANGED" ]; then
            echo ""
            echo "❌ No changeset file found."
            echo ""
            echo "Please run 'pnpm changeset' to describe your changes, or add the 'no-changeset' label to this PR if no versioning is needed."
            exit 1
          fi

          echo "✅ Changeset found: $CHANGED"
