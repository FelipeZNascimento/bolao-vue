name: 📂 Deploy

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: 'Snapshot tag to deploy (leave blank to use latest Actions artifact)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - prod

  workflow_call:
    inputs:
      snapshot_tag:
        description: 'Snapshot tag to deploy (leave blank to use latest Actions artifact)'
        type: string
        required: false
        default: ''
    secrets:
      username:
        required: true
      password:
        required: true

jobs:
  deploy:
    name: 📂 Sync files via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download dist from GitHub Release
        if: ${{ inputs.snapshot_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ inputs.snapshot_tag }} \
            --repo ${{ github.repository }} \
            --pattern 'dist.zip' \
            --dir ./release
          unzip ./release/dist.zip -d ./release

      - name: 📥 Download dist from Actions artifact
        if: ${{ inputs.snapshot_tag == '' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./release/dist/

      - name: 🔐 Resolve credentials
        id: creds
        run: |
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "prod" ]; then
            echo "username=${{ secrets.username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.password }}" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "preprod" ]; then
            echo "username=${{ secrets.preprod_username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.preprod_password }}" >> $GITHUB_OUTPUT
          else
            # Called via workflow_call — secrets passed directly by the caller
            echo "username=${{ secrets.username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.password }}" >> $GITHUB_OUTPUT
          fi

      - id: deployTarget
        name: 📂 Sync files to target
        continue-on-error: true
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.host }}
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.password }}
          localDir: './release/dist/'
          remoteDir: './'
          port: 22

      - name: 🔁 Retry upload if handshake failed
        if: steps.deployTarget.outcome == 'failure'
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.host }}
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.password }}
          localDir: './release/dist/'
          remoteDir: './'
          port: 22
