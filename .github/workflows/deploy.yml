name: 📂 Deploy

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: 'Snapshot tag to deploy (leave blank for latest snapshot)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - prod

  workflow_call:
    inputs:
      snapshot_tag:
        description: 'Snapshot tag to deploy (leave blank to use Actions artifact from calling job)'
        type: string
        required: false
        default: ''

jobs:
  deploy:
    name: 📂 Sync files via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download dist from GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.snapshot_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.snapshot_tag }}"

          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo ${{ github.repository }} --limit 50 --json tagName,isPrerelease \
              | node -e "
                const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const snap = d.find(r => r.isPrerelease && r.tagName.startsWith('snapshot-'));
                if (!snap) { console.error('No snapshot pre-release found'); process.exit(1); }
                process.stdout.write(snap.tagName);
              ")
            echo "Resolved latest snapshot: $TAG"
          fi

          gh release download "$TAG" \
            --repo ${{ github.repository }} \
            --pattern 'dist.zip' \
            --dir ./release
          unzip ./release/dist.zip -d ./release

      - name: 📥 Download dist from Actions artifact
        if: ${{ github.event_name != 'workflow_dispatch' && inputs.snapshot_tag == '' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./release/dist/

      - name: 🔐 Resolve credentials
        id: creds
        run: |
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "prod" ]; then
            echo "username=${{ secrets.username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.password }}" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "preprod" ]; then
            echo "username=${{ secrets.preprod_username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.preprod_password }}" >> $GITHUB_OUTPUT
          else
            # Called via workflow_call — secrets passed directly by the caller
            echo "username=${{ secrets.username }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.password }}" >> $GITHUB_OUTPUT
          fi

      - name: 🐛 Debug inputs
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "inputs.environment: ${{ inputs.environment }}"
          echo "inputs.snapshot_tag: ${{ inputs.snapshot_tag }}"
          echo "creds.username is set: ${{ steps.creds.outputs.username != '' }}"
          echo "creds.password is set: ${{ steps.creds.outputs.password != '' }}"
          echo "secrets.host is set: ${{ secrets.host != '' }}"
          echo "release/dist/ exists: $(ls ./release/dist/ 2>/dev/null && echo yes || echo no)"

      - id: deployTarget
        name: 📂 Sync files to target
        continue-on-error: true
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.host }}
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.password }}
          localDir: './release/dist/'
          remoteDir: './'
          port: 22

      - name: 🔁 Retry upload if handshake failed
        if: steps.deployTarget.outcome == 'failure'
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.host }}
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.password }}
          localDir: './release/dist/'
          remoteDir: './'
          port: 22
